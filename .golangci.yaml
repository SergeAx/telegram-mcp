version: "2"
run:
  concurrency: 4
  issues-exit-code: 2
  tests: true
  allow-parallel-runners: true
  allow-serial-runners: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
  sort-order:
    - linter
    - severity
    - file
  path-prefix: ""
linters:
  enable:
    - asciicheck
    - bodyclose
    - canonicalheader
    - copyloopvar
    - dupl
    - errorlint
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - grouper
    - importas
    - inamedparam
    - lll
    - makezero
    - nestif
    - nilerr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - revive
    - testifylint
    - whitespace
    - wrapcheck
  settings:
    dupl:
      threshold: 100
    gocyclo:
      min-complexity: 15
    lll:
      line-length: 150
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - gocyclo
          - gosec
          - lll
        path: _test\.go
      - linters:
          - importas
        path: internal/config/
      - linters:
          - gocritic
        path: cmd/.*\.go
        text: exitAfterDefer
      - linters:
          - nolintlint
        text: should be written without leading space as
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
